<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Winvest OCR</title>
<style>
  body{margin:0;font-family:sans-serif;background:#0f1729;color:#fff;padding:14px;font-size:13px}
  h3{margin:0 0 8px;color:#10b77f;font-size:16px}
  #log{font-family:monospace;font-size:11px;color:#cbd5e1;white-space:pre-wrap;
       max-height:360px;overflow:auto;background:#0a1220;padding:8px;
       border-radius:6px;border:1px solid #1e2a44}
  .ok{color:#4ade80}.err{color:#f87171}.best{color:#fbbf24;font-weight:bold}
  #previews{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  #previews img{border:1px solid #1e2a44;border-radius:4px;background:#fff;
                height:60px;image-rendering:pixelated}
</style>
</head>
<body>
<h3>Winvest · Resolent captcha</h3>
<div id="previews"></div>
<div id="log">Esperant la imatge…</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const logEl = document.getElementById('log');
const log = (m, cls) => {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = m;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
};

window.addEventListener('message', async (e) => {
    if (!e.data || e.data.type !== 'wv-ocr-request') return;

    const images = e.data.images || [];
    const labels = e.data.labels || [];

    const previews = document.getElementById('previews');
    previews.innerHTML = '';
    for (let i = 0; i < images.length; i++) {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center';
        const img = document.createElement('img');
        img.src = images[i];
        const cap = document.createElement('span');
        cap.textContent = labels[i] || (i+1);
        cap.style.cssText = 'font-size:10px;color:#64748b;margin-top:2px';
        wrap.appendChild(img);
        wrap.appendChild(cap);
        previews.appendChild(wrap);
    }

    try {
        log('Creant worker Tesseract…');
        const worker = await Tesseract.createWorker('eng', 1, {
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
            corePath:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/',
            langPath:   'https://tessdata.projectnaptha.com/4.0.0',
            logger: m => {
                if (m.status === 'recognizing text') return;
                log('[tesseract] ' + m.status +
                    (m.progress !== undefined && m.progress < 1 ? ' ' + Math.round(m.progress*100) + '%' : ''));
            }
        });
        await worker.setParameters({ tessedit_char_whitelist: '0123456789' });

        const psms = ['7', '8'];
        const raw = [];
        for (let i = 0; i < images.length; i++) {
            for (const psm of psms) {
                try {
                    await worker.setParameters({ tessedit_pageseg_mode: psm });
                    const { data: { text } } = await worker.recognize(images[i]);
                    const cleaned = (text || '').replace(/[^0-9]/g, '');
                    raw.push({ text, cleaned, label: labels[i], psm });
                    log(`  ${labels[i]} psm${psm}: "${cleaned}"`);
                } catch (err) {
                    log(`  ${labels[i]} psm${psm}: error ${err}`);
                }
            }
        }
        await worker.terminate();

        // ---- Votació ----
        // Comptem quantes lectures donen exactament el mateix resultat
        const counts = {};
        for (const r of raw) {
            if (!r.cleaned) continue;
            counts[r.cleaned] = (counts[r.cleaned] || 0) + 1;
        }
        log('Vots:', JSON.stringify(counts));

        // Puntuem cada resultat únic
        const unics = [];
        for (const key of Object.keys(counts)) {
            let sc = 0;
            const votes = counts[key];
            // Vots: cada coincidència val molt
            sc += votes * 500;
            // Longitud: si és 4, bonus gran
            if (key.length === 4) sc += 2000;
            else if (key.length === 3 || key.length === 5) sc -= 500;
            else sc -= 3000;

            unics.push({
                cleaned: key,
                score: sc,
                votes
            });
        }
        unics.sort((a, b) => b.score - a.score);
        const best = unics[0] || { cleaned: '', score: -9999, votes: 0 };
        log(`🏆 Guanyador: "${best.cleaned}" (${best.votes} vots, score ${best.score})`, 'best');

        if (window.opener) {
            window.opener.postMessage({
                type: 'wv-ocr-result',
                text: best.cleaned,
                cleaned: best.cleaned,
                allResults: raw,
                votes: counts
            }, '*');
        }
        setTimeout(() => window.close(), 2500);
    } catch (err) {
        log('Error: ' + err, 'err');
        if (window.opener) window.opener.postMessage({ type: 'wv-ocr-error', error: String(err) }, '*');
        setTimeout(() => window.close(), 3000);
    }
});

window.opener && window.opener.postMessage({ type: 'wv-ocr-ready' }, '*');
</script>
</body>
</html>
